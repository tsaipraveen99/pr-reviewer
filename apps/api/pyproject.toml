[project]
name = "prcrew"
version = "0.1.0"
description = "FastAPI + LangGraph backend for pr-reviewer, a multi-agent GitHub PR reviewer."
readme = "README.md"
authors = [
    { name = "Sai Praveen Tatiparthi", email = "saipraveen.tatiparthi@sjsu.edu" }
]
requires-python = ">=3.12"
dependencies = [
    "alembic>=1.19.1",
    "anthropic>=0.122.0",
    "celery[redis]>=5.6.3",
    "fastapi>=0.141.1",
    "httpx>=0.28.1",
    "langgraph>=1.2.11",
    "psycopg[binary]>=3.3.4",
    "pydantic>=2.13.4",
    "slowapi>=0.1.10",
    "sqlalchemy>=2.0",
    "sse-starlette>=3.4.8",
    "uvicorn>=0.52.3",
]

[build-system]
requires = ["uv_build>=0.11.16,<0.12.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "aiosqlite>=0.22.1",
    "httpx>=0.28.1",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "respx>=0.23.1",
    "ruff>=0.16.3",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
pythonpath = ["."]
