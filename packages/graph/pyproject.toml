[project]
name = "prgraph"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Sai Praveen Tatiparthi", email = "saipraveen.tatiparthi@sjsu.edu" }
]
requires-python = ">=3.12"
dependencies = [
    "sqlalchemy>=2.0",
    "tree-sitter>=0.23",
    "tree-sitter-javascript>=0.25.0",
    "tree-sitter-python>=0.25.0",
    "tree-sitter-typescript>=0.23.2",
]

[build-system]
requires = ["uv_build>=0.11.16,<0.12.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.16.3",
]

[tool.pytest.ini_options]
pythonpath = ["."]
